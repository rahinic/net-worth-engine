# Source of truth for the synthetic persona, version 3.
# Illustrative simulation, synthetic data, not financial advice.
version: 3

persona:
  label: Pooja
  age: 35
  gender: female
  pronouns: she/her
  origin: Indian
  city: Berlin
  marital_status: married
  spouse_income: similar   # synthetic, not modelled in detail
  currency: EUR

income:
  gross_annual_eur: 50000
  raise:
    pct: 10
    every_years: 3
    mode: step          # nominal, applied at each third anniversary
  # Approximate figure from the brief, kept for reference. The engine does not use it: net pay is
  # computed from gross by persona/tax.py. Computed result for tax class IV is
  # about 2,690 per month, see README.
  net_monthly_target_eur: 3000

tax:
  tax_class: IV         # married, spouse on a similar income
  children: 0           # assumed, affects the care insurance rate
  church_tax: false
  health_insurance: statutory
  function: persona/tax.py

start_net_worth_eur:
  etf: 15000
  savings: 12000
  gold: 3000            # total 30000

monthly_eur:
  # The brief had 600 / 100 / 1350 / 950 (total 3000). All four were scaled by
  # the same factor (about 0.897) so the total equals the net pay computed by
  # persona/tax.py at the start (about 2690), leaving no shortfall and no surplus.
  etf_savings_plan: 538
  indian_gold_scheme: 90    # paid in EUR, converted to INR in the gold model
  fixed_costs: 1210         # approximate; rent, utilities, insurance, phone
  variable_costs: 852       # approximate; groceries, leisure, transport, other
  # Costs grow with inflation (rate set in the simulation assumptions).
  # Contributions are flat in nominal terms, except in the growing scenario.

# The monthly ETF savings plan is split by these weights. The 15000 of
# starting ETFs is assumed to be held in the same weights, in both portfolios.
portfolios:
  two_etf:
    description: World plus S&P 500
    weights: not set yet
  four_etf_thematic:
    description: broad world, emerging markets and two themes
    weights:
      msci_world: 0.50
      emerging_markets: 0.15
      ai_and_big_data: 0.175
      renewable_energy: 0.175   # weights sum to 1.0

scenarios:
  - id: flat_historical
    contributions: flat_nominal
    returns: historical
  - id: flat_conservative
    contributions: flat_nominal
    returns: conservative       # historical minus 2 percentage points
  - id: growing_historical
    contributions: grow_with_salary   # ETF and gold rise 10% at each raise
    returns: historical

simulation:
  start_date: 2024-01-01
  horizon_years: 30
  leftover_cash_to: savings     # net pay - costs - contributions; negative draws savings down

# Parked from version 2, not part of version 3: the Altersvorsorgedepot
# (150 per month from 2027) and its subsidy rules are in the git history.
